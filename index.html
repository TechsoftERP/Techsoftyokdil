'Paragraph Completion':{title:'Paragraf Tamamlama',html:'<b>Taktik:</b> Boşluktan önce ve sonra anahtar referansları izle: this/these/such/they, tekrar eden kavramlar ve bağlaçlar.<br><b>Tuzak:</b> Konuya uygun ama paragrafın akışındaki köprü görevini yapmayan cümle.'},
'Irrelevant Sentence':{title:'Anlam Bütünlüğünü Bozan Cümle',html:'<b>Taktik:</b> Paragrafın tek cümlelik ana konusunu çıkar. Her cümlenin önceki ve sonraki cümleyle bağlantısını test et.<br><b>Tuzak:</b> Aynı kelimeleri içerdiği için konu dışı cümleyi ilgili sanmak.'},
'Dialogue':{title:'Diyalog Tamamlama',html:'<b>Taktik:</b> Eksik repliğin öncesindeki soru/tepki ile sonrasındaki cevabı birlikte oku. Konuşma niyetini bul: öneri, kabul, ret, açıklama, şaşkınlık.<br><b>Tuzak:</b> Tek başına doğal görünen fakat karşı repliğe cevap vermeyen seçenek.'},
'Restatement':{title:'Yakın Anlamlı Cümle',html:'<b>Taktik:</b> Değişmemesi gereken dört şeyi kontrol et: özne, ana yargı, neden-sonuç/zıtlık ilişkisi ve derece-miktar.<br><b>Tuzak:</b> only, most, may, must, despite gibi anlam gücünü değiştiren küçük kelimeler.'},
'Reading':{title:'Okuma – Paragraf Soruları',html:'<b>Taktik:</b> Soru kökünü önce oku; ana fikirde bütün paragrafı, detayda ilgili bölümü, çıkarımda yalnız metnin desteklediği sonucu kullan.<br><b>Tuzak:</b> Genel bilgine göre doğru olan ama metinde desteklenmeyen seçenek.'}

const moreQs=[
{type:'Vocabulary',field:'Ortak',q:'The new evidence may ---- our understanding of how the disease spreads.',o:['enhance','postpone','withdraw','divide','ignore'],a:0,tactic:'Boşluk modal sonrası V1 ister. “understanding” ile doğal akademik eşleşmeyi ara.',trap:'Anlamı yakın görünen ama collocation oluşturmayan fiile gitmek.',why:['✓ enhance understanding doğal kullanımdır.','Ertelemek.','Geri çekmek.','Bölmek.','Görmezden gelmek.'],tr:'Yeni kanıtlar hastalığın nasıl yayıldığına ilişkin anlayışımızı geliştirebilir.',words:'evidence: kanıt • enhance: geliştirmek • spread: yayılmak'},
{type:'Preposition',field:'Ortak',q:'Economic growth is closely associated ---- investment in education and technology.',o:['at','with','for','from','by'],a:1,tactic:'Kalıbı ara: be associated with.',trap:'Türkçedeki “ile” anlamını rastgele edatla eşleştirmek.',why:['Yanlış kalıp.','✓ associated with.','Yanlış kalıp.','Yanlış kalıp.','Yanlış kalıp.'],tr:'Ekonomik büyüme eğitim ve teknoloji yatırımlarıyla yakından ilişkilidir.',words:'associated with: ile ilişkili • investment: yatırım'},
{type:'Cloze Test',field:'Ortak',q:'Scientific knowledge changes as new evidence emerges. A theory may be widely accepted for years; ----, new findings can require researchers to revise it.',o:['however','therefore','because','for example','unless'],a:0,tactic:'İki fikir arasındaki ilişkiyi bul: uzun süre kabul görme ↔ yeni bulgularla değişebilme = zıtlık.',trap:'Yeni bulgu sonucu değişiklik var diye therefore seçmek; burada önceki beklentiyle karşıtlık vurgulanıyor.',why:['✓ Zıtlık.','Sonuç bağlacı burada vurguya uymaz.','Neden yapısı uymaz.','Örnek verilmiyor.','Koşul değil.'],tr:'Bilimsel bilgi yeni kanıtlarla değişir. Bir teori yıllarca kabul görebilir; ancak yeni bulgular onun gözden geçirilmesini gerektirebilir.',words:'emerge: ortaya çıkmak • revise: gözden geçirmek'},
{type:'EN-TR Translation',field:'Ortak',q:'Although the technology is still expensive, its potential benefits have attracted considerable interest.',o:['Teknoloji hâlâ pahalı olduğu için yararları ilgi görmemiştir.','Teknoloji hâlâ pahalı olmasına rağmen potansiyel yararları önemli ölçüde ilgi çekmiştir.','Teknoloji ucuzladığında yararları daha fazla ilgi çekecektir.','Teknolojinin pahalı olması yararlarının azalmasına yol açmıştır.','Teknoloji pahalıdır ve potansiyel yararları bilinmemektedir.'],a:1,tactic:'Although = -mesine rağmen; have attracted = çekmiştir. İki kritik yapıyı aynı anda koruyan şıkkı ara.',trap:'Although’u neden-sonuç gibi çevirmek.',why:['Zıtlık kayboluyor.','✓ Anlam ve zaman korunuyor.','Gelecek anlam eklenmiş.','Neden-sonuç eklenmiş.','Metinde olmayan anlam.'],tr:'Teknoloji hâlâ pahalı olmasına rağmen potansiyel yararları önemli ölçüde ilgi çekmiştir.',words:'potential: potansiyel • considerable: önemli ölçüde • attract interest: ilgi çekmek'},
{type:'TR-EN Translation',field:'Ortak',q:'Araştırmacılar, sonuçların beklenenden daha önemli olduğunu ileri sürmektedir.',o:['Researchers claim that the findings are more significant than expected.','Researchers denied that the results had been expected.','The findings were less significant according to researchers.','Researchers will expect more significant findings.','The results prevent researchers from making a claim.'],a:0,tactic:'Ana iskelet: Researchers claim that...; karşılaştırma: more significant than expected.',trap:'Aynı kelimeleri içerip yargının yönünü değiştiren seçenek.',why:['✓ Tam anlam eşleşmesi.','Reddetme anlamı ekliyor.','Daha az diyor.','Gelecek anlamı ekliyor.','Engelleme anlamı ekliyor.'],tr:'Researchers claim that the findings are more significant than expected.',words:'claim: ileri sürmek • significant: önemli • expected: beklenen'},
{type:'Paragraph Completion',field:'Ortak',q:'Online education has expanded rapidly. It gives learners access to courses regardless of location. ----. For this reason, successful online programs often include interactive activities and regular feedback.',o:['However, keeping learners actively engaged can be difficult','Universities were first established centuries ago','Printed books are available in many libraries','Some cities have larger populations than others','Laboratories require safety equipment'],a:0,tactic:'Sonraki “For this reason” ifadesinin hangi probleme çözüm getirdiğini ara: interactive activities → engagement problemi.',trap:'Eğitimle ilgili olduğu için her eğitim cümlesini uygun sanmak.',why:['✓ Sonraki cümlenin nedenini hazırlar.','Konu zinciri kopuyor.','Konu dışı.','Konu dışı.','Konu dışı.'],tr:'Çevrim içi eğitim hızla genişledi... Ancak öğrencileri aktif biçimde derse bağlı tutmak zor olabilir.',words:'engaged: aktif/ilgili • feedback: geri bildirim'},
{type:'Dialogue',field:'Ortak',q:'A: Why has the meeting been postponed?\nB: ----\nA: I see. Then we can discuss the report tomorrow.',o:['Because two members of the committee are unavailable today.','I submitted the report last week.','The meeting room is on the second floor.','Yes, the report was very detailed.','I prefer written reports.'],a:0,tactic:'Why sorusuna neden bildiren cevap gerekir; ardından “Then ... tomorrow” ifadesi bugünkü engeli doğrular.',trap:'Meeting/report kelimeleri geçen ama soruya cevap vermeyen şık.',why:['✓ Doğrudan neden bildiriyor.','Neden değil.','Yer bildiriyor.','Değerlendirme.','Tercih.'],tr:'A: Toplantı neden ertelendi? B: Çünkü komitenin iki üyesi bugün müsait değil.',words:'postpone: ertelemek • unavailable: müsait olmayan'},
{type:'Restatement',field:'Ortak',q:'Despite the rapid growth of the sector, many firms remain cautious about investing in it.',o:['Although the sector is growing rapidly, many firms are still cautious about investing in it.','Because the sector is growing rapidly, all firms invest in it.','The sector will grow only if firms invest cautiously.','Many firms stopped the sector from growing rapidly.','Rapid growth has made every firm confident about investment.'],a:0,tactic:'Despite + isim = Although + cümle dönüşümünü ve “many/remain cautious” bilgisini koru.',trap:'Bağlaç değişirken neden-sonuç ilişkisine dönüştürmek.',why:['✓ Aynı zıtlık ve nicelik.','Neden ve all ekliyor.','Koşul ekliyor.','Nedensellik değişiyor.','Anlam tersine dönüyor.'],tr:'Sektör hızla büyümesine rağmen birçok firma yatırım konusunda temkinli kalmaktadır.',words:'despite: rağmen • remain cautious: temkinli kalmak'},
{type:'Reading',field:'Ortak',q:'A recent study found that employees who were allowed flexible starting times reported higher job satisfaction. Productivity did not decline, but the researchers noted that flexibility alone could not solve problems caused by excessive workloads. What can be inferred?',o:['Flexible schedules may improve satisfaction without necessarily reducing productivity.','Flexible schedules always reduce workloads.','Productivity increased dramatically in every case.','Employees preferred longer working hours.','The study found flexibility unnecessary.'],a:0,tactic:'Çıkarım sorusunda metnin iki açık bulgusunu birleştir; “always/every” gibi aşırı ifadelerden kaçın.',trap:'Metinde olmayan güçlü genellemeyi doğru sanmak.',why:['✓ İki bulguyla destekleniyor.','Metin tersine, workload sorununu tek başına çözmediğini söylüyor.','Dramatik artış yok.','Böyle bilgi yok.','Ters anlam.'],tr:'Esnek başlangıç saatleri memnuniyeti artırabilir ve bunun için verimliliğin düşmesi gerekmez.',words:'flexible: esnek • workload: iş yükü • decline: düşmek'}

qs.push(...moreQs);
let i=0,selected=null,correct=Number(localStorage.correct||0),mistakes=JSON.parse(localStorage.mistakes||'[]'),activeQuestions=qs;
function goHome(){home.classList.remove('hidden');quiz.classList.add('hidden');updateStats()}
function start(){activeQuestions=qs;home.classList.add('hidden');quiz.classList.remove('hidden');i=0;render()}function startType(t,topic=null){let found=qs.filter(x=>x.type===t&&(!topic||x.topic===topic));if(!found.length){showTypeLesson(t);return}activeQuestions=found;home.classList.add('hidden');quiz.classList.remove('hidden');i=0;render()}function render(){selected=null;result.innerHTML='';nextBtn.classList.add('hidden');answerBtn.classList.remove('hidden');let x=activeQuestions[i];type.textContent=x.type+' • '+x.field;counter.textContent=(i+1)+' / '+activeQuestions.length;q.textContent=x.q;options.innerHTML=x.o.map((v,j)=>`<button class="opt" onclick="pick(${j},this)"><b>${'ABCDE'[j]})</b> ${v}</button>`).join('')}
function pick(j,b){selected=j;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function answer(){if(selected===null)return alert('Önce bir seçenek seç.');let x=activeQuestions[i],ok=selected===x.a;if(ok){correct++;localStorage.correct=correct}else{mistakes.push({type:x.type,date:Date.now()});localStorage.mistakes=JSON.stringify(mistakes)};result.innerHTML=`<div class="section ok"><h3>${ok?'✅ DOĞRU':'❌ YANLIŞ'} — Doğru cevap ${'ABCDE'[x.a]}</h3></div><div class="section"><h3>🧠 TAKTİKLE ÇÖZÜM</h3>${x.tactic}</div><div class="section trap"><h3>🚨 TUZAK NOKTASI</h3>${x.trap}</div><div class="section"><h3>🔎 ŞIKLAR NEDEN?</h3>${x.why.map((w,j)=>`<div><b>${'ABCDE'[j]}${j===x.a?' ✓':''}</b> ${w}</div>`).join('')}</div><div class="section evidence"><h3>🇹🇷 TÜRKÇESİ / KANIT</h3>${x.tr}</div><div class="section"><h3>📚 ÖNEMLİ KELİMELER</h3>${x.words}</div>`;answerBtn.classList.add('hidden');nextBtn.classList.remove('hidden')}
function nextQ(){i=(i+1)%activeQuestions.length;render()}
function showMistakes(){goHome();let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);alert(mistakes.length?Object.entries(c).map(x=>x[0]+': '+x[1]+' yanlış').join('\n'):'Henüz yanlışın yok.')}
function showTypeLesson(t){let L=typeLessons[t];if(!L){startType(t);return}lesson.innerHTML='<div class="section evidence"><h3>🎓 '+L.title.toUpperCase()+' — HIZLI ANLATIM</h3>'+L.html+'</div><button class="primary" onclick="startType(\''+t+'\')">SORULARA BAŞLA →</button>';lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'})}
function showGrammarMenu(){lesson.innerHTML=grammarMenu;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'})}
function showGrammarLesson(topic){lesson.innerHTML=`<div class="section evidence"><h3>🎓 ${topic.toUpperCase()} — HIZLI ANLATIM</h3>${lessons[topic]}</div><button class="primary" onclick="startType('${topic==='Bağlaçlar'?'Connector':'Grammar'}','${topic}')">${topic.toUpperCase()} SORULARINA BAŞLA →</button>`;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'})}
function renderTypes(){typesGrid.innerHTML=studyTypes.map((x,n)=>`<button class="type-card" onclick="${x[0]==='Grammar'?'showGrammarMenu()':`showTypeLesson('${x[0]}')`}"><b>${n+1}. ${x[1]}</b><span>${x[2]}</span></button>`).join('')}function updateStats(){streak.textContent=correct+' doğru';let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);let w=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];weak.textContent=w?w[0]:'Henüz veri yok'}renderTypes();updateStats();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
