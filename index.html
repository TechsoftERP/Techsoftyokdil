<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.json'><title>YÖKDİL Koç</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding:18px 16px calc(150px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center}.badge{background:#eef2ff;padding:7px 10px;border-radius:999px;font-weight:700;font-size:12px}.hero{margin:18px 0;padding:20px;border-radius:22px;background:#111827;color:white}.hero h1{margin:0 0 8px;font-size:27px}.hero p{opacity:.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,button{border:0;border-radius:16px}.card{padding:16px;background:#f8fafc;border:1px solid #e5e7eb}.card b{display:block;margin-bottom:5px}button{padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.primary{width:100%;background:#2563eb;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.hidden{display:none}.qtop{display:flex;justify-content:space-between;margin:14px 0;color:#6b7280;font-size:13px}.question{font-size:19px;line-height:1.55;font-weight:650}.opt{width:100%;text-align:left;margin:7px 0;background:#f8fafc;border:1px solid #d1d5db}.opt.sel{outline:2px solid #2563eb}.result{margin-top:16px;padding-bottom:8px}.section{margin:10px 0;padding:14px;border-radius:15px;background:#f8fafc}.section h3{margin:0 0 7px;font-size:15px}.ok{background:#ecfdf5}.trap{background:#fff7ed}.evidence{background:#eff6ff}.muted{color:#6b7280;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:1000;box-shadow:0 -6px 18px rgba(17,24,39,.08)}.bottom div{width:min(700px,100%);display:flex;gap:8px}.bottom button{flex:1;background:#f3f4f6}#nextBtn{margin-bottom:18px}.stats{margin-top:16px;font-size:14px}select{padding:10px;border-radius:12px;border:1px solid #d1d5db;background:#fff}.types-grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}.type-card{width:100%;text-align:left;padding:14px;background:#fff;border:1px solid #e5e7eb;border-radius:15px}.type-card b{display:block;font-size:15px;margin-bottom:4px}.type-card span{font-size:12px;color:#6b7280;font-weight:500}.type-card:active{background:#eff6ff}
</style></head><body><main class='app'>
<header><strong>YÖKDİL KOÇ</strong><span class='badge'>PWA • V1</span></header>
<section id='home'><div class='hero'><h1>Soru çözme, çözmeyi öğren.</h1><p>Fen ve Sosyal Bilimler • taktik • tuzak • kanıt • yanlış tekrarı</p><button class='primary' onclick='start()'>Bugünkü Çalışmaya Başla</button></div>
<div class='grid'><div class='card'><b>🎯 Alan</b><select id='field'><option>Sosyal Bilimler</option><option>Fen Bilimleri</option></select></div><div class='card'><b>🔥 Seri</b><span id='streak'>0 doğru</span></div><div class='card'><b>🧠 Mod</b>Bana Öğret</div><div class='card'><b>🚨 Odak</b><span id='weak'>Henüz veri yok</span></div></div>
<div class='stats'><b>📚 Soru Tipine Göre Çalış</b><div id='typesGrid' class='types-grid'></div></div></section>
<section id='quiz' class='hidden'><div class='qtop'><span id='type'></span><span id='counter'></span></div><div class='question' id='q'></div><div id='options'></div><button class='primary' id='answerBtn' onclick='answer()'>CEVAPLA</button><div id='result' class='result'></div><button class='primary hidden' id='nextBtn' onclick='nextQ()'>BENZER / SONRAKİ SORU →</button></section>
</main><div class='bottom'><div><button onclick='goHome()'>🏠 Ana Sayfa</button><button onclick='start()'>🧠 Çalış</button><button onclick='showMistakes()'>🚨 Yanlışlarım</button></div></div>
<script>
const qs=[
{type:'Connector',field:'Ortak',q:'Although the new policy was expected to reduce costs, its implementation ---- more expensive than initially predicted.',o:['proves','proved','has proving','to prove','prove'],a:1,tactic:'Although ile iki bölüm arasında zıtlık ara. Sonra zaman ve özne–fiil uyumunu kontrol et.',trap:'“Although”u görünce sadece anlamı takip edip fiilin zamanını kaçırmak. Cümle geçmişteki bir beklentiyi anlatıyor.',why:['“proves” geniş zaman; bağlamdaki was expected ile uyumsuz.','“proved” hem geçmiş zamanla hem de zıtlık anlamıyla uyumlu.','“has proving” dilbilgisel olarak yanlış.','“to prove” burada yüklem görevini karşılamaz.','“prove” üçüncü tekil özneyle ve zamanla uymaz.'],tr:'Yeni politikanın maliyetleri azaltması beklenmesine rağmen, uygulanmasının başlangıçta öngörülenden daha pahalı olduğu ortaya çıktı.',words:'implementation: uygulama • initially: başlangıçta • predict: öngörmek'},
{type:'Vocabulary',field:'Fen Bilimleri',q:'The telescope allows astronomers to ---- extremely faint objects that cannot be seen with the naked eye.',o:['detect','postpone','consume','withdraw','mislead'],a:0,tactic:'Önce boşluğun fiil istediğini belirle. “telescope + faint objects” birlikteliğinden gözlem/tespit anlamını ara.',trap:'Tek tek kelime çevirisine takılmak. Akademik collocation burada cevabı hızlandırır: detect objects/signals.',why:['“detect” = tespit etmek; anlam ve kullanım uyumlu.','“postpone” = ertelemek; nesneyle anlamsal uyumsuz.','“consume” = tüketmek.','“withdraw” = geri çekmek.','“mislead” = yanıltmak.'],tr:'Teleskop, astronomların çıplak gözle görülemeyen son derece soluk nesneleri tespit etmesini sağlar.',words:'faint: soluk/zayıf • naked eye: çıplak göz • detect: tespit etmek'},
{type:'Sentence Completion',field:'Sosyal Bilimler',q:'Because digital platforms can rapidly connect buyers and sellers, ----.',o:['their role in modern markets has expanded considerably','most ancient markets were located near ports','the experiment had been cancelled before noon','water freezes at zero degrees Celsius','the device requires regular calibration'],a:0,tactic:'Because = neden. Verilen bölüm nedeni söylüyor; seçeneklerde bunun mantıklı sonucunu ara.',trap:'Gramer olarak düzgün ama konu dışı seçeneklere gitmek. Önce “digital platforms / markets” konu zincirini koru.',why:['Neden-sonuç ve konu bütünlüğü tam.','Pazar kelimesi geçse de zaman ve konu zinciri kopuyor.','Konu dışı.','Konu dışı bilimsel gerçek.','Konu dışı teknik ifade.'],tr:'Dijital platformlar alıcılarla satıcıları hızla buluşturabildiği için modern piyasalardaki rolleri önemli ölçüde genişlemiştir.',words:'rapidly: hızla • considerably: önemli ölçüde • expand: genişlemek'},
{type:'Irrelevant Sentence',field:'Ortak',q:'(I) Remote work has changed how many organizations coordinate their employees. (II) Digital collaboration tools allow teams to communicate across different locations. (III) Managers have also developed new methods for evaluating performance remotely. (IV) Volcanoes can remain inactive for centuries before erupting. (V) As a result, workplace practices are increasingly being redesigned for distributed teams. Which sentence is irrelevant?',o:['I','II','III','IV','V'],a:3,tactic:'Önce paragrafın tek cümlelik konusunu çıkar: “uzaktan çalışma ve iş organizasyonu”. Sonra bu zinciri kıran cümleyi bul.',trap:'Bağlaç veya ortak kelime aramak yerine anlam zincirini izle. İlgisiz cümle bazen dilbilgisel olarak tamamen düzgündür.',why:['Ana konuya giriş.','Uzaktan ekip iletişimini sürdürüyor.','Uzaktan performans yönetimini sürdürüyor.','Volkanlar konu zincirini tamamen kesiyor.','Paragrafı sonuçlandırıyor.'],tr:'Paragraf uzaktan çalışmanın örgütsel uygulamalara etkisini anlatmaktadır; IV. cümle volkanlardan söz ettiği için ilgisizdir.',words:'coordinate: koordine etmek • evaluate: değerlendirmek • distributed teams: dağıtık ekipler'}
];
const studyTypes=[
['Vocabulary','Kelime Bilgisi (Vocabulary)','Akademik kelime, fiil, sıfat, isim'],
['Grammar','Dil Bilgisi (Grammar)','Tense, modal, passive, relative clause vb.'],
['Preposition','Preposition / Phrasal Yapılar','Edat ve kalıp kullanımları'],
['Cloze Test','Cloze Test','Paragraf içindeki boşlukları tamamlama'],
['Sentence Completion','Cümle Tamamlama','Anlam ve gramer açısından cümleyi tamamlama'],
['EN-TR Translation','İngilizce → Türkçe Çeviri','Doğru Türkçe karşılığı bulma'],
['TR-EN Translation','Türkçe → İngilizce Çeviri','Doğru İngilizce karşılığı bulma'],
['Paragraph Completion','Paragraf Tamamlama','Eksik cümleyi bağlama göre bulma'],
['Irrelevant Sentence','Anlam Bütünlüğünü Bozan Cümle','Paragrafın akışına uymayan cümleyi bulma'],
['Dialogue','Karşılıklı Konuşma / Diyalog Tamamlama','Diyalogdaki eksik ifadeyi bulma'],
['Restatement','Yakın Anlamlı Cümle (Restatement)','Verilen cümleyle aynı anlamı taşıyan seçeneği bulma'],
['Reading','Okuma – Paragraf Soruları','Ana fikir, detay, çıkarım, referans vb.']
];let i=0,selected=null,correct=Number(localStorage.correct||0),mistakes=JSON.parse(localStorage.mistakes||'[]'),activeQuestions=qs;
function goHome(){home.classList.remove('hidden');quiz.classList.add('hidden');updateStats()}
function start(){activeQuestions=qs;home.classList.add('hidden');quiz.classList.remove('hidden');i=0;render()}function startType(t){let found=qs.filter(x=>x.type===t);if(!found.length){alert('Bu bölüm hazırlandı. Soru bankası bir sonraki güncellemede eklenecek.');return}activeQuestions=found;home.classList.add('hidden');quiz.classList.remove('hidden');i=0;render()}
function render(){selected=null;result.innerHTML='';nextBtn.classList.add('hidden');answerBtn.classList.remove('hidden');let x=activeQuestions[i];type.textContent=x.type+' • '+x.field;counter.textContent=(i+1)+' / '+activeQuestions.length;q.textContent=x.q;options.innerHTML=x.o.map((v,j)=>`<button class="opt" onclick="pick(${j},this)"><b>${'ABCDE'[j]})</b> ${v}</button>`).join('')}
function pick(j,b){selected=j;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function answer(){if(selected===null)return alert('Önce bir seçenek seç.');let x=activeQuestions[i],ok=selected===x.a;if(ok){correct++;localStorage.correct=correct}else{mistakes.push({type:x.type,date:Date.now()});localStorage.mistakes=JSON.stringify(mistakes)};result.innerHTML=`<div class="section ok"><h3>${ok?'✅ DOĞRU':'❌ YANLIŞ'} — Doğru cevap ${'ABCDE'[x.a]}</h3></div><div class="section"><h3>🧠 TAKTİKLE ÇÖZÜM</h3>${x.tactic}</div><div class="section trap"><h3>🚨 TUZAK NOKTASI</h3>${x.trap}</div><div class="section"><h3>🔎 ŞIKLAR NEDEN?</h3>${x.why.map((w,j)=>`<div><b>${'ABCDE'[j]}${j===x.a?' ✓':''}</b> ${w}</div>`).join('')}</div><div class="section evidence"><h3>🇹🇷 TÜRKÇESİ / KANIT</h3>${x.tr}</div><div class="section"><h3>📚 ÖNEMLİ KELİMELER</h3>${x.words}</div>`;answerBtn.classList.add('hidden');nextBtn.classList.remove('hidden')}
function nextQ(){i=(i+1)%activeQuestions.length;render()}
function showMistakes(){goHome();let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);alert(mistakes.length?Object.entries(c).map(x=>x[0]+': '+x[1]+' yanlış').join('\n'):'Henüz yanlışın yok.')}
function renderTypes(){typesGrid.innerHTML=studyTypes.map((x,n)=>`<button class="type-card" onclick="startType('${x[0]}')"><b>${n+1}. ${x[1]}</b><span>${x[2]}</span></button>`).join('')}function updateStats(){streak.textContent=correct+' doğru';let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);let w=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];weak.textContent=w?w[0]:'Henüz veri yok'}renderTypes();updateStats();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
