{type:'Grammar',topic:'Modals',field:'Ortak',q:'You ---- submit the form today; the deadline has been extended until Friday.',o:['must','have to','needn’t','should have','must have'],a:2,tactic:'Zorunluluğun olmadığını anlatan ipucu: son tarih uzatılmış → needn’t + V1.',trap:'Deadline kelimesini görüp otomatik must/have to seçmek.',why:['Zorunluluk bildirir.','Zorunluluk bildirir.','✓ Gerek yok.','Geçmişte yapılmalıydı anlamı.','Geçmiş çıkarım.'],tr:'Formu bugün teslim etmen gerekmiyor; son tarih cumaya uzatıldı.',words:'needn’t: gerek yok • deadline: son tarih • extend: uzatmak'},

'Active-Passive':'<b>1.</b> Özne işi yapıyorsa active; iş özneye yapılıyorsa passive.<br><b>2.</b> Passive iskelet: uygun zamanda <b>be + V3</b>.<br><b>3.</b> Modal passive: modal + be + V3; perfect passive: have/has been + V3.<br><b>🚨 Tuzak:</b> Zaman doğru olsa bile active/passive yönü yanlış olabilir.',

function answer(){if(selected===null)return alert('Önce bir seçenek seç.');let x=activeQuestions[i],ok=selected===x.a;if(ok){correct++;localStorage.correct=correct}else{mistakes.push({type:x.type,date:Date.now()});localStorage.mistakes=JSON.stringify(mistakes)};result.innerHTML=`<div class="section ok"><h3>${ok?'✅ DOĞRU':'❌ YANLIŞ'} — Doğru cevap ${'ABCDE'[x.a]}</h3></div><div class="section"><h3>🧠 TAKTİKLE ÇÖZÜM</h3>${x.tactic}</div><div class="section trap"><h3>🚨 TUZAK NOKTASI</h3>${x.trap}</div><div class="section"><h3>🔎 ŞIKLAR NEDEN?</h3>${x.why.map((w,j)=>`<div><b>${'ABCDE'[j]}${j===x.a?' ✓':''}</b> ${w}</div>`).join('')}</div><div class="section evidence"><h3>🇹🇷 TÜRKÇESİ / KANIT</h3>${x.tr}</div><div class="section"><h3>📚 ÖNEMLİ KELİMELER</h3>${x.words}</div>`;answerBtn.classList.add('hidden');nextBtn.classList.remove('hidden')}
function nextQ(){i=(i+1)%activeQuestions.length;render()}
function showMistakes(){goHome();let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);alert(mistakes.length?Object.entries(c).map(x=>x[0]+': '+x[1]+' yanlış').join('\n'):'Henüz yanlışın yok.')}
function showGrammarMenu(){lesson.innerHTML=grammarMenu;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'})}
function showGrammarLesson(topic){lesson.innerHTML=`<div class="section evidence"><h3>🎓 ${topic.toUpperCase()} — HIZLI ANLATIM</h3>${lessons[topic]}</div><button class="primary" onclick="startType('${topic==='Bağlaçlar'?'Connector':'Grammar'}','${topic}')">${topic.toUpperCase()} SORULARINA BAŞLA →</button>`;lesson.classList.remove('hidden');lesson.scrollIntoView({behavior:'smooth'})}
function renderTypes(){typesGrid.innerHTML=studyTypes.map((x,n)=>`<button class="type-card" onclick="${x[0]==='Grammar'?'showGrammarMenu()':`startType('${x[0]}')`}"><b>${n+1}. ${x[1]}</b><span>${x[2]}</span></button>`).join('')}function updateStats(){streak.textContent=correct+' doğru';let c={};mistakes.forEach(x=>c[x.type]=(c[x.type]||0)+1);let w=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];weak.textContent=w?w[0]:'Henüz veri yok'}renderTypes();updateStats();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
